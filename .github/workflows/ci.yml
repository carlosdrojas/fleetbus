# Not yet run on GitHub (the repo is unpublished); every step runs locally with `make test`.
name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: make setup
      - name: Host build + Unity tests
        run: make host-test
      - name: Dashboard tests (against the simulator)
        run: make py-test
      - name: Cross-build for MSPM0G3507 (size report in the log)
        run: make fw
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fw-mspm0/arm/*/*.elf
            build/fw-mspm0/*.map
