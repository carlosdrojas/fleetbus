# NOTE: written alongside the code but not yet executed on GitHub (everything below was run locally on macOS).
# First push: expect to fix package names/versions for ubuntu-latest.
name: ci
on: [push, pull_request]

env:
  FLEETBUS_REQUIRE_DB: "1"          # database tests fail instead of skipping when Postgres is missing

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Host build + Unity tests + simulator (both board flash maps)
        run: make host-test
      - name: Cross-build bootloaders + apps for STM32G431 (size report in the log)
        run: |
          cmake -S firmware -B build/fw -G Ninja -DFB_BOARD=stm32g4 -DCMAKE_TOOLCHAIN_FILE=$PWD/firmware/cmake/arm-none-eabi.cmake -DFB_BENCH_FAULT_IMAGES=ON
          cmake --build build/fw
      - name: Cross-build for MSPM0G3507 (LaunchPad, primary target)
        run: make fw-mspm0
      - name: Car-bus transmit guard
        run: tools/check_car_tx.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-elf-bin-map
          path: |
            build/fw*/arm/*/*.elf
            build/fw*/arm/*/*.bin
            build/fw*/arm/*/*.map

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fleetbus, POSTGRES_PASSWORD: fleetbus, POSTGRES_DB: fleetbus }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U fleetbus" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - run: cd backend && go vet ./... && go test -race -count=1 ./...
      - name: Fuzz the FBP decoder for 30 s
        run: cd backend && go test ./internal/fbp -run xxx -fuzz FuzzDecode -fuzztime 30s

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: cmake -S firmware -B build/host -G Ninja && cmake --build build/host
      - run: python -m venv .venv && .venv/bin/pip install -q -e "gateway[dev]" "psycopg[binary]"
      - run: .venv/bin/python -m pytest gateway/tests hil -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: cd dashboard && npm ci && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [firmware, backend, python]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fleetbus, POSTGRES_PASSWORD: fleetbus, POSTGRES_DB: fleetbus }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U fleetbus" --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: cmake -S firmware -B build/host -G Ninja && cmake --build build/host
      - run: python -m venv .venv && .venv/bin/pip install -q -e "gateway[dev]" "psycopg[binary]"
      - run: .venv/bin/python -m pytest tests/e2e -q -s
