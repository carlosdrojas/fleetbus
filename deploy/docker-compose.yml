# FleetBus local stack. M0: Postgres only. Ingest, API and dashboard join in M7–M8.
name: fleetbus

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleetbus
      POSTGRES_PASSWORD: fleetbus   # local dev only
      POSTGRES_DB: fleetbus
    ports:
      - "5433:5432"   # 5433 on the host: a native Postgres often owns 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetbus -d fleetbus"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
