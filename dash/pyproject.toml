[project]
name = "fleetbus-dash"
version = "0.1.0"
description = "FleetBus Lite live CAN dashboard"
requires-python = ">=3.11"
dependencies = ["python-can>=4.4", "cantools>=39", "pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fleetbus-dash = "fleetbus.lite_dash:main"

[tool.setuptools]
packages = ["fleetbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
